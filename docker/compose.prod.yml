services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Database password not specified}
  migration:
    environment:
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?Database password not specified}
  importer:
    restart: unless-stopped
    environment:
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?Database password not specified}
  api:
    restart: unless-stopped
    environment:
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?Database password not specified}
      - ENV=prod
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must list allowed browser origins, e.g. https://heliotime.org}
  site:
    restart: unless-stopped
