name: Keep updated

on:
  schedule:
    # Mondays 06:00 UTC — catch drift between Dependabot PRs
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'site/package.json'
      - 'site/yarn.lock'
      - 'site/Dockerfile'
      - 'server/environment.yml'
      - 'server/conda-lock.yml'
      - 'server/Dockerfile'
      - 'docker/**'
      - '.github/workflows/keep-updated.yml'
  pull_request:
    paths:
      - 'site/package.json'
      - 'site/yarn.lock'
      - 'site/Dockerfile'
      - 'server/environment.yml'
      - 'server/conda-lock.yml'
      - 'server/Dockerfile'
      - 'docker/**'
      - '.github/workflows/keep-updated.yml'
  workflow_dispatch:

jobs:
  site:
    name: Site build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: site/yarn.lock

      - name: Enable Yarn Classic
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install and build Visx
        run: yarn install --frozen-lockfile && yarn build
        working-directory: site/visx

      - name: Install site dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Audit (fail on high/critical)
        run: |
          set +e
          yarn audit --level high
          code=$?
          set -e
          # Yarn's exit code is a bit field for every severity it found.
          # --level only hides lower findings from the log. High is 8 and critical is 16.
          if [ $((code & 24)) -ne 0 ]; then
            exit "$code"
          fi

  server-lockfile:
    name: Conda lockfile freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.12'

      - name: Install conda-lock
        run: pip install 'conda-lock==2.5.*'

      # Compare resolved packages. conda-lock rewrites dependency key order
      # without changing the packages that get installed.
      - name: Regenerate lockfile and diff
        run: |
          cp conda-lock.yml conda-lock.yml.bak
          conda-lock -f environment.yml -p linux-64 -p linux-aarch64 --lockfile conda-lock.yml
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML

          yaml = YAML(typ="safe")

          def identity(path):
              data = yaml.load(Path(path))
              rows = []
              for pkg in data["package"]:
                  digest = pkg.get("hash") or {}
                  rows.append((
                      str(pkg.get("platform")),
                      str(pkg.get("manager")),
                      str(pkg["name"]),
                      str(pkg.get("version")),
                      str(pkg.get("url")),
                      str(digest.get("sha256") or digest.get("md5")),
                  ))
              return rows

          previous = identity("conda-lock.yml.bak")
          current = identity("conda-lock.yml")
          if sorted(previous) != sorted(current):
              removed = sorted(set(previous) - set(current))
              added = sorted(set(current) - set(previous))
              print("::error::server/conda-lock.yml does not match environment.yml. Regenerate it with conda-lock 2.5.")
              for platform, _manager, name, version, _url, _digest in removed:
                  print(f"- {platform} {name} {version}")
              for platform, _manager, name, version, _url, _digest in added:
                  print(f"+ {platform} {name} {version}")
              raise SystemExit(1)
          print("conda-lock.yml matches environment.yml")
          PY

  docker-compose:
    name: Compose config validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose --project-directory . --file ./docker/compose.yml --file ./docker/compose.dev.yml config --quiet

      - name: Validate prod compose
        env:
          DATABASE_PASSWORD: ci-test-password
          CORS_ORIGINS: https://example.org
        run: docker compose --project-directory . --file ./docker/compose.yml --file ./docker/compose.prod.yml config --quiet
